[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "email-notifier"
version = "0.1.0"
description = "Send a Slack notification whenever a new email arrives, via Gmail Pub/Sub push notifications."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [{ name = "Leo Chen", email = "leo.chen0412@outlook.com" }]
keywords = ["gmail", "slack", "notifications", "pubsub", "email"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "rich>=13.7",
  "google-api-python-client>=2.140",
  "google-auth>=2.30",
  "google-auth-oauthlib>=1.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
email-notifier = "email_notifier.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/email_notifier"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
# macOS AppleDouble sidecar files (created on non-APFS volumes)
extend-exclude = ["**/._*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=email_notifier --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
